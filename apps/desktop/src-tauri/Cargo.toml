[package]
name = "zukunft"
version = "0.1.14"
description = "GitHub Issue × Gantt schedule editor"
edition = "2021"
rust-version = "1.77"

[lib]
name = "zukunft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["sync", "time"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
thiserror = "2"
# 背景画像だけのための依存。画像のバイト列は JSON の IPC に乗らないので、
# 画面と Rust の間では base64 の文字列にして渡す。この機能で足した新規依存はこれ 1 つ。
base64 = "0.22"

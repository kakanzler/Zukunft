query ProjectItems($projectId: ID!, $after: String) {
  node(id: $projectId) {
    ... on ProjectV2 {
      items(first: 100, after: $after) {
        pageInfo { hasNextPage endCursor }
        nodes {
          id
          fieldValues(first: 100) { ...FieldValues }
          content {
            __typename
            ... on Issue { ...IssueContent }
          }
        }
      }
    }
  }
  rateLimit { remaining limit resetAt }
}

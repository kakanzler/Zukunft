# リポジトリに定義済みのラベル一覧。Issue に付け外しする候補になる。
# 読み落とすと、既にある名前での作成が失敗して理由が読めなくなる。
query RepositoryLabels($repositoryId: ID!, $after: String) {
  node(id: $repositoryId) {
    ... on Repository {
      labels(first: 100, after: $after, orderBy: { field: NAME, direction: ASC }) {
        pageInfo { hasNextPage endCursor }
        nodes { id name color }
      }
    }
  }
}

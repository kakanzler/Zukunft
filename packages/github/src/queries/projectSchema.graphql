# Project のフィールド定義。$after で続きを辿る — フィールドが多い Project で
# Date / Status の定義を読み落とすと、既にあるフィールドを「作れ」と案内してしまう。
query ProjectSchema($projectId: ID!, $after: String) {
  node(id: $projectId) {
    ... on ProjectV2 {
      id
      fields(first: 100, after: $after) {
        pageInfo { hasNextPage endCursor }
        nodes {
          __typename
          ... on ProjectV2FieldCommon { id name dataType }
          ... on ProjectV2SingleSelectField { options { id name } }
        }
      }
    }
  }
  rateLimit { remaining limit resetAt }
}

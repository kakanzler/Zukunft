query ItemUpdatedAt($itemId: ID!) {
  node(id: $itemId) {
    ... on ProjectV2Item {
      id
      fieldValues(first: 100) { ...FieldValues }
      content {
        __typename
        # 書き込み後の再取得もここを通るので、選択は projectItems.graphql と揃える。
        # 共通のフラグメントにしてあるのは、片方だけ直して食い違わせないため。
        ... on Issue { ...IssueContent }
      }
    }
  }
}

# リポジトリに定義済みの Milestone 一覧。Issue に設定する候補になる。
# 閉じた Milestone は付け替え先にしないため OPEN のみ、期日順で返す。
query RepositoryMilestones($repositoryId: ID!, $after: String) {
  node(id: $repositoryId) {
    ... on Repository {
      milestones(
        first: 100
        after: $after
        states: OPEN
        orderBy: { field: DUE_DATE, direction: ASC }
      ) {
        pageInfo { hasNextPage endCursor }
        nodes { id title dueOn }
      }
    }
  }
}

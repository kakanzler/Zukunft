# ラベルに触らずに Issue 本体を更新する。
#
# updateIssue の labelIds は「置き換え集合」なので、こちらが全ラベルを
# 読み切れていないときに送ると、読めなかった分が Issue から永久に外れる。
# 変数を null にするのではなく input からキーごと落とすことで、
# 「変更しない」を曖昧さなく表す。
mutation UpdateIssueKeepLabels($issueId: ID!, $title: String!, $body: String!, $milestoneId: ID) {
  updateIssue(input: { id: $issueId, title: $title, body: $body, milestoneId: $milestoneId }) {
    issue { id number title url body updatedAt }
  }
}
